# LightShop local environments. Every image is open source; every host port is configurable (LS_*_PORT).
#
#   pnpm infra:up            core dev deps: Postgres + Kafka (run services with pnpm dev:*)
#   pnpm infra:up:obs        + OTel Collector, Tempo, Prometheus, Grafana
#   pnpm infra:up:identity   + Keycloak (realm as code)
#   pnpm local:up            PRODUCTION-LIKE STACK: real images in NODE_ENV=production behind an ingress,
#                            Keycloak, Temporal + worker, Kafka, Postgres, observability (scripts/local/stack.sh)
name: lightshop

x-node-health: &node-health
  interval: 5s
  timeout: 3s
  retries: 40

x-app-env: &app-env
  NODE_ENV: production
  LOG_FORMAT: json
  REGION: local
  DEPLOY_ENV: local
  EVENT_BUS: kafka
  KAFKA_BROKERS: kafka:29092
  GATEWAY_SHARED_SECRET: ${LS_GATEWAY_SECRET:-local-stack-gateway-secret-0123456789abcdef}
  OIDC_ISSUER: http://localhost:${LS_KEYCLOAK_PORT:-8180}/realms/lightshop
  OIDC_AUDIENCE: lightshop
  OIDC_JWKS_URL: http://keycloak:8080/realms/lightshop/protocol/openid-connect/certs
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_METRIC_EXPORT_INTERVAL: "5000"
  TENANTS_URL: http://tenant-registry:4002/v1/tenants?status=live
  TENANTS_REFRESH_MS: "3000"

services:
  # ---------------------------------------------------------------- data
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lightshop
      POSTGRES_PASSWORD: lightshop
      POSTGRES_DB: lightshop
    ports: ["${LS_PG_PORT:-55432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightshop"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    ports: ["${LS_KAFKA_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: containers use kafka:29092, the host uses localhost:<LS_KAFKA_PORT>.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${LS_KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  redis:
    profiles: [full]
    image: valkey/valkey:8-alpine
    ports: ["${LS_VALKEY_PORT:-6379}:6379"]

  opensearch:
    profiles: [full]
    image: opensearchproject/opensearch:2.19.2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["${LS_OPENSEARCH_PORT:-9200}:9200"]

  object-storage:
    profiles: [full]
    image: chrislusf/seaweedfs:3.85
    command: server -s3 -dir=/data
    ports: ["${LS_S3_PORT:-8333}:8333"]
    volumes: [s3data:/data]

  # ---------------------------------------------------------------- platform
  temporal:
    profiles: [full, stack]
    image: temporalio/auto-setup:1.27
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: lightshop
      POSTGRES_PWD: lightshop
      POSTGRES_SEEDS: postgres
    ports: ["${LS_TEMPORAL_PORT:-7233}:7233"]

  temporal-ui:
    profiles: [full, stack]
    image: temporalio/ui:2.36.0
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["${LS_TEMPORAL_UI_PORT:-8233}:8080"]

  # Production mode (not start-dev) on Postgres. Browser URL = http://localhost:<LS_KEYCLOAK_PORT>;
  # containers use http://keycloak:8080 (hostname-backchannel-dynamic) while tokens keep the public issuer.
  keycloak:
    profiles: [full, identity, stack]
    image: quay.io/keycloak/keycloak:26.2
    command:
      - start
      - --import-realm
      - --http-enabled=true
      - --hostname=http://localhost:${LS_KEYCLOAK_PORT:-8180}
      - --hostname-backchannel-dynamic=true
      - --health-enabled=true
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: lightshop
      KC_DB_PASSWORD: lightshop
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes: ["./infra/keycloak/lightshop-realm.json:/opt/keycloak/data/import/lightshop-realm.json:ro"]
    ports: ["${LS_KEYCLOAK_PORT:-8180}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 60

  # ---------------------------------------------------------------- observability
  otel-collector:
    profiles: [full, observability, stack]
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["${LS_OTLP_GRPC_PORT:-4317}:4317", "${LS_OTLP_HTTP_PORT:-4318}:4318"]

  tempo:
    profiles: [full, observability, stack]
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./infra/observability/tempo.yaml:/etc/tempo.yaml:ro"]

  prometheus:
    profiles: [full, observability, stack]
    image: prom/prometheus:v3.5.0
    volumes: ["./infra/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["${LS_PROMETHEUS_PORT:-9090}:9090"]

  grafana:
    profiles: [full, observability, stack]
    image: grafana/grafana-oss:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${LS_GRAFANA_PORT:-3001}:3000"]

  # ---------------------------------------------------------------- LightShop (same images as production)
  tenant-registry:
    profiles: [stack]
    image: lightshop/tenant-registry:local
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args: { PACKAGE: "@lightshop/tenant-registry", VERSION: local }
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      temporal: { condition: service_started }
    restart: unless-stopped   # waits out Temporal's first-boot schema setup
    # Admin API on the host for local operators/tests (production: internal only, reach via port-forward).
    ports: ["127.0.0.1:${LS_REGISTRY_PORT:-4002}:4002"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *app-env
      TENANT_REGISTRY_DATABASE_URL: postgres://lightshop:lightshop@postgres:5432/tenant_registry
      TEMPORAL_ADDRESS: temporal:7233
      SEED_TENANTS_DIR: /app/config/tenants
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://localhost:4002/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]

  tenant-registry-worker:
    profiles: [stack]
    image: lightshop/tenant-registry:local
    command: ["node", "dist/worker.js"]
    depends_on:
      tenant-registry: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *app-env
      TENANT_REGISTRY_DATABASE_URL: postgres://lightshop:lightshop@postgres:5432/tenant_registry
      TEMPORAL_ADDRESS: temporal:7233

  catalog:
    profiles: [stack]
    image: lightshop/catalog:local
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args: { PACKAGE: "@lightshop/catalog-service", VERSION: local }
    depends_on:
      tenant-registry: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *app-env
      CATALOG_DATABASE_URL: postgres://lightshop:lightshop@postgres:5432/catalog
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://localhost:4001/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]

  gateway:
    profiles: [stack]
    image: lightshop/gateway:local
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
      args: { PACKAGE: "@lightshop/gateway", VERSION: local }
    depends_on:
      catalog: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *app-env
      SUBGRAPHS: catalog=http://catalog:4001/graphql
      TRUST_PROXY: "true"
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]

  web-storefront:
    profiles: [stack]
    image: lightshop/web-storefront:local
    build:
      context: .
      dockerfile: apps/web-storefront/Dockerfile
      args: { VERSION: local }
    depends_on:
      gateway: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /app/apps/web-storefront/.next/cache]
    environment:
      <<: *app-env
      API_URL: http://gateway:4000/graphql
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/lightshop/.well-known/openid-configuration
      OIDC_CLIENT_ID: lightshop-storefront
      OIDC_CLIENT_SECRET: ${LS_STOREFRONT_CLIENT_SECRET:-dev-storefront-secret-change-me}
      SESSION_SECRET: ${LS_SESSION_SECRET:-local-stack-session-secret-0123456789abcdef}
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://localhost:5678/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]

  # Local stand-in for the production ingress: http://<store-domain>:<LS_HTTP_PORT>
  edge:
    profiles: [stack]
    image: caddy:2.10-alpine
    depends_on:
      web-storefront: { condition: service_healthy }
    volumes: ["./infra/local/Caddyfile:/etc/caddy/Caddyfile:ro"]
    ports: ["${LS_HTTP_PORT:-8088}:8088"]

  # One-shot: loads the demo catalog through the PUBLIC API with real IdP tokens (no SEED_DEMO in production).
  seed:
    profiles: [stack]
    image: node:22-bookworm-slim
    depends_on:
      gateway: { condition: service_healthy }
    working_dir: /repo
    volumes: [".:/repo:ro"]
    command: ["node", "scripts/local/seed.mjs"]
    restart: "no"
    environment:
      API_URL: http://gateway:4000/graphql
      GATEWAY_SHARED_SECRET: ${LS_GATEWAY_SECRET:-local-stack-gateway-secret-0123456789abcdef}
      TOKEN_URL: http://keycloak:8080/realms/lightshop/protocol/openid-connect/token

volumes:
  pgdata:
  s3data:
