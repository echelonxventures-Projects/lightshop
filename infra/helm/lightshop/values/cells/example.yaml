# Copy per cell (e.g. values/cells/us.yaml, values/cells/in.yaml). Nothing here is cloud-specific except
# optional workload-identity annotations.
global:
  region: example                         # cell code: becomes REGION, span/metric attribute, data-residency label
  env:
    OIDC_ISSUER: https://id.example.com/realms/lightshop
    OIDC_JWKS_URL: https://id.example.com/realms/lightshop/protocol/openid-connect/certs
    OIDC_CLIENT_ID: lightshop-storefront
gateway:
  ingress:
    className: traefik                    # or envoy, haproxy, nginx, alb, gce...
    hosts: [shop.example.com, www.brand-two.example]   # every store domain; served at /graphql
  networkPolicy:
    allowFromNamespaces: [traefik]
webStorefront:
  ingress:
    className: traefik
    hosts: [shop.example.com, www.brand-two.example]
  networkPolicy:
    allowFromNamespaces: [traefik]
  env:
    # Split-horizon IdP: browser uses OIDC_ISSUER, the server fetches discovery internally (optional).
    # OIDC_DISCOVERY_URL: http://keycloak-http.identity/realms/lightshop/.well-known/openid-configuration
# Workload identity for cloud APIs (only if a service needs one):
# catalog:
#   serviceAccount:
#     annotations: { eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/lightshop-catalog }
