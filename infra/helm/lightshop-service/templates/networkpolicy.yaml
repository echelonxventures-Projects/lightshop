{{- if and .Values.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}
  labels: {{- include "ls.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "ls.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- if .Values.port }}
    - from:
        {{- range .Values.networkPolicy.allowFromPods }}
        - podSelector:
            matchLabels: {{- toYaml . | nindent 14 }}
        {{- end }}
        {{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ . }} } }
        {{- end }}
      ports: [{ port: {{ .Values.port }} }]
    {{- end }}
{{- end }}
