# TLS for tenant custom domains (ACME)
# Enable on a cell cluster with label: lightshop/dep-cert-manager: "in-cluster"
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dep-cert-manager
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters:
        selector:
          matchLabels: { lightshop/dep-cert-manager: "in-cluster" }
  template:
    metadata:
      name: 'dep-cert-manager-{{ index .metadata.labels "lightshop/region" }}'
    spec:
      project: default
      sources:
        - repoURL: https://charts.jetstack.io
          chart: cert-manager
          targetRevision: "v1.21.2"
          helm:
            releaseName: cert-manager
            valueFiles: [$repo/infra/argocd/values/cert-manager.yaml]
        - repoURL: https://github.com/echelonxventures-Projects/lightshop.git
          targetRevision: main
          ref: repo
      destination:
        server: '{{ .server }}'
        namespace: cert-manager
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
