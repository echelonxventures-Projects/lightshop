---
# Cell-level platform resources (Postgres cluster + databases, Kafka cluster, ClusterIssuer, secret wiring).
# Enable with label: lightshop/platform-manifests: "true"
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-manifests
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters:
        selector:
          matchLabels: { lightshop/platform-manifests: "true" }
  template:
    metadata:
      name: 'platform-{{ index .metadata.labels "lightshop/region" }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/echelonxventures-Projects/lightshop.git
        targetRevision: main
        path: infra/k8s/platform
      destination:
        server: '{{ .server }}'
        namespace: lightshop
      syncPolicy:
        automated: { prune: false, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true, SkipDryRunOnMissingResource=true]
