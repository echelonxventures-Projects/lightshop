# Secret wiring via External Secrets Operator. Pick ONE SecretStore backend; every ExternalSecret below stays the same.
# Required keys are listed in docs/runbooks/deployment.md.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: lightshop
spec:
  provider:
    # --- HashiCorp Vault / OpenBao ---
    vault:
      server: https://vault.example.com
      path: secret
      version: v2
      auth: { kubernetes: { mountPath: kubernetes, role: lightshop } }
    # --- AWS Secrets Manager ---
    # aws: { service: SecretsManager, region: us-east-1, auth: { jwt: { serviceAccountRef: { name: external-secrets } } } }
    # --- Google Secret Manager ---
    # gcpsm: { projectID: my-project }
    # --- Azure Key Vault ---
    # azurekv: { vaultUrl: https://my-vault.vault.azure.net, authType: WorkloadIdentity, serviceAccountRef: { name: external-secrets } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: lightshop-shared }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: lightshop, kind: SecretStore }
  target: { name: lightshop-shared }
  data:
    - { secretKey: gateway-shared-secret, remoteRef: { key: lightshop/shared, property: gateway-shared-secret } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: lightshop-catalog-db }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: lightshop, kind: SecretStore }
  target: { name: lightshop-catalog-db }
  data:
    - { secretKey: url, remoteRef: { key: lightshop/catalog-db, property: url } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: lightshop-tenant-registry-db }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: lightshop, kind: SecretStore }
  target: { name: lightshop-tenant-registry-db }
  data:
    - { secretKey: url, remoteRef: { key: lightshop/tenant-registry-db, property: url } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: lightshop-storefront-oidc }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: lightshop, kind: SecretStore }
  target: { name: lightshop-storefront-oidc }
  data:
    - { secretKey: client-secret, remoteRef: { key: lightshop/storefront-oidc, property: client-secret } }
    - { secretKey: session-secret, remoteRef: { key: lightshop/storefront-oidc, property: session-secret } }
