# ACME certificates for every tenant domain (HTTP-01 through whatever ingress controller the cell runs).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform-ops@example.com   # change me
    privateKeySecretRef: { name: letsencrypt-account }
    solvers:
      - http01: { ingress: {} }
