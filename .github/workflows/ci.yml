name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read # nx-set-shas looks up the last successful run to compute affected projects

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      - name: Lint, typecheck, test, build (affected only)
        run: pnpm nx affected -t lint typecheck test build --parallel=3

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t build -p @lightshop/catalog-service @lightshop/web-storefront
      - run: pnpm --filter @lightshop/web-storefront exec playwright install --with-deps chromium
      - run: pnpm --filter @lightshop/web-storefront e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web-storefront/playwright-report }

  catalog-postgres:
    needs: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: lightshop, POSTGRES_PASSWORD: lightshop, POSTGRES_DB: catalog }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lightshop" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run @lightshop/catalog-service:build
      - name: Boot catalog on Postgres and verify seed + outbox drain
        env:
          CATALOG_DATABASE_URL: postgres://lightshop:lightshop@localhost:5432/catalog
          SEED_DEMO: "true"
        run: |
          node services/catalog/dist/main.js & sleep 6
          curl -sf localhost:4001/health | tee /dev/stderr | grep -q '"outboxPending":0'
          curl -sf localhost:4001/graphql -H 'content-type: application/json' -H 'x-tenant-id: acme-mart' \
            -d '{"query":"{ products { edges { node { id } } } }"}' | grep -q prd_demo_phone

  integration:
    needs: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: lightshop, POSTGRES_PASSWORD: lightshop, POSTGRES_DB: lightshop }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lightshop" --health-interval 5s --health-retries 10
      kafka:
        image: apache/kafka:3.9.1
        ports: ["9092:9092"]
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t build -p @lightshop/catalog-service @lightshop/adapters @lightshop/testing
      - name: Wait for Kafka
        run: for i in $(seq 1 30); do (echo > /dev/tcp/localhost/9092) 2>/dev/null && exit 0; sleep 2; done; exit 1
      - name: Integration tests (real Postgres + Kafka)
        env:
          TEST_DATABASE_URL: postgres://lightshop:lightshop@localhost:5432/lightshop
          TEST_KAFKA_BROKERS: localhost:9092
        run: |
          pnpm --filter @lightshop/catalog-service exec vitest run test/postgres.integration.test.ts
          pnpm --filter @lightshop/adapters exec vitest run src/events/kafka-event-bus.integration.test.ts
      - name: End-to-end event flow (catalog → outbox → Kafka)
        env:
          CATALOG_DATABASE_URL: postgres://lightshop:lightshop@localhost:5432/lightshop
          EVENT_BUS: kafka
          KAFKA_BROKERS: localhost:9092
          SEED_DEMO: "true"
        run: |
          node services/catalog/dist/main.js & sleep 8
          curl -sf localhost:4001/health | tee /dev/stderr | grep -q '"outboxPending":0'
          node -e "
            const { Kafka } = require('./libs/adapters/node_modules/kafkajs');
            const c = new Kafka({ brokers: ['localhost:9092'] }).consumer({ groupId: 'ci-check' });
            (async () => { await c.connect(); await c.subscribe({ topic: 'catalog.product.v1', fromBeginning: true });
              let n = 0; const t = setTimeout(() => { console.error('only', n, 'events'); process.exit(1); }, 30000);
              await c.run({ eachMessage: async () => { if (++n >= 13) { clearTimeout(t); console.log('received', n, 'catalog events from Kafka'); process.exit(0); } } }); })();
          "

  identity:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run @lightshop/auth:build
      - name: Start Keycloak with the realm-as-code
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/infra/keycloak/lightshop-realm.json:/opt/keycloak/data/import/lightshop-realm.json:ro" \
            quay.io/keycloak/keycloak:26.2 start-dev --import-realm
          for i in $(seq 1 60); do curl -sf localhost:8080/realms/lightshop/.well-known/openid-configuration >/dev/null && exit 0; sleep 3; done
          docker logs keycloak | tail -50; exit 1
      - name: Keycloak tokens satisfy the LightShop claims contract
        run: |
          token() { curl -sf localhost:8080/realms/lightshop/protocol/openid-connect/token \
            -d grant_type=password -d client_id=lightshop-ci -d client_secret=ci-secret -d scope=openid \
            -d username=$1 -d password=$1 | node -pe 'JSON.parse(require("fs").readFileSync(0)).access_token'; }
          GADGET=$(token gadgetco) OPS=$(token ops) node -e "
            const { JwksTokenVerifier } = require('./libs/auth');
            const v = new JwksTokenVerifier({ issuer: 'http://localhost:8080/realms/lightshop', audience: 'lightshop',
              jwksUrl: 'http://localhost:8080/realms/lightshop/protocol/openid-connect/certs' });
            (async () => {
              const seller = await v.verify(process.env.GADGET);
              const ops = await v.verify(process.env.OPS);
              const ok = seller.tenantId === 'acme-mart' && seller.sellerId === 'sel_gadgetco' && seller.roles.includes('seller')
                && ops.tenantId === '*' && ops.roles.includes('platform:admin');
              console.log(JSON.stringify({ seller, ops }, null, 2));
              if (!ok) { console.error('claims contract not satisfied'); process.exit(1); }
            })().catch((e) => { console.error(e); process.exit(1); });
          "

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - name: Terraform fmt + cell contract
        run: |
          terraform fmt -check -recursive infra/terraform
          python3 infra/terraform/scripts/check-contract.py
      - name: Terraform validate (every cloud)
        run: |
          for env in aws gcp azure on-prem; do
            echo "::group::$env"
            terraform -chdir=infra/terraform/envs/$env init -backend=false -input=false >/dev/null
            terraform -chdir=infra/terraform/envs/$env validate
            echo "::endgroup::"
          done
      - uses: azure/setup-helm@v4
      - name: Helm lint + render + Kubernetes schema validation
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          helm lint infra/helm/lightshop-service
          helm dependency update infra/helm/lightshop
          for env in staging production; do
            helm lint infra/helm/lightshop -f infra/helm/lightshop/values/env/$env.yaml -f infra/helm/lightshop/values/cells/example.yaml
            helm template ls infra/helm/lightshop -f infra/helm/lightshop/values/env/$env.yaml -f infra/helm/lightshop/values/cells/example.yaml \
              | ./kubeconform -strict -summary -kubernetes-version 1.33.0
          done
      - name: Platform manifests and ArgoCD definitions parse
        run: |
          kubectl kustomize infra/k8s/platform > /dev/null
          python3 -c "import yaml,glob; [list(yaml.safe_load_all(open(f))) for f in glob.glob('infra/argocd/**/*.yaml', recursive=True)]"

  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image coordinates
        id: img
        run: |
          # Registry is configurable (repo/org variable IMAGE_REGISTRY): GHCR, ECR, GAR, ACR, Harbor, Quay...
          REG="${{ vars.IMAGE_REGISTRY }}"
          [ -z "$REG" ] && REG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lightshop"
          echo "registry=$REG" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_SHA::12}" >> $GITHUB_OUTPUT
      - name: Build images
        run: |
          set -e
          build() { docker buildx build --load --cache-from type=gha,scope=$1 --cache-to type=gha,mode=max,scope=$1 \
            --build-arg VERSION=${{ steps.img.outputs.tag }} -t "${{ steps.img.outputs.registry }}/$1:${{ steps.img.outputs.tag }}" "${@:2}" .; }
          build catalog         -f infra/docker/node-service.Dockerfile --build-arg PACKAGE=@lightshop/catalog-service
          build tenant-registry -f infra/docker/node-service.Dockerfile --build-arg PACKAGE=@lightshop/tenant-registry
          build gateway         -f infra/docker/node-service.Dockerfile --build-arg PACKAGE=@lightshop/gateway
          build web-storefront  -f apps/web-storefront/Dockerfile
      - name: Smoke test the images as a running stack
        run: |
          set -e
          R="${{ steps.img.outputs.registry }}"; T="${{ steps.img.outputs.tag }}"
          docker network create ls
          common="--network ls --read-only --tmpfs /tmp -e NODE_ENV=development -e GATEWAY_SHARED_SECRET=ci-smoke-secret"
          docker run -d --name tenant-registry $common -e SEED_TENANTS_DIR=/app/config/tenants "$R/tenant-registry:$T"
          docker run -d --name catalog $common -e SEED_DEMO=true -e TENANTS_URL='http://tenant-registry:4002/v1/tenants?status=live' "$R/catalog:$T"
          sleep 8
          docker run -d --name gateway $common -p 4000:4000 -e SUBGRAPHS=catalog=http://catalog:4001/graphql \
            -e TENANTS_URL='http://tenant-registry:4002/v1/tenants?status=live' "$R/gateway:$T"
          docker run -d --name web $common --tmpfs /app/apps/web-storefront/.next/cache -p 5678:5678 \
            -e API_URL=http://gateway:4000/graphql -e TENANTS_URL='http://tenant-registry:4002/v1/tenants?status=live' "$R/web-storefront:$T"
          for i in $(seq 1 30); do curl -sf localhost:5678/api/health >/dev/null && curl -sf localhost:4000/health >/dev/null && break; sleep 2; done
          curl -sf -H 'Host: acme.localhost' localhost:4000/graphql -H 'content-type: application/json' \
            -d '{"query":"{ products { edges { node { id } } } }"}' | tee /dev/stderr | grep -q prd_demo_phone
          curl -sf -H 'Host: verde.localhost' localhost:5678/ | grep -q '<title>Verde Wholesale</title>'
          echo "stack OK: registry → catalog → gateway → storefront, read-only root filesystems"
      - name: Container logs on failure
        if: failure()
        run: for c in tenant-registry catalog gateway web; do echo "== $c"; docker logs $c 2>&1 | tail -40; done
      - name: Push (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.IMAGE_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}" | docker login "${{ steps.img.outputs.registry }}" -u "${{ vars.IMAGE_REGISTRY_USER || github.actor }}" --password-stdin
          for i in catalog tenant-registry gateway web-storefront; do
            docker push "${{ steps.img.outputs.registry }}/$i:${{ steps.img.outputs.tag }}"
          done

  # The production-like stack (docs/runbooks/local-production.md) on every PR: same images, NODE_ENV=production,
  # Keycloak, Temporal + worker, Kafka, Postgres, observability, ingress — then the full end-to-end suite.
  stack:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lightshop/web-storefront exec playwright install --with-deps chromium
      - name: Start the stack
        run: pnpm local:up
      - name: End-to-end suite against the stack
        run: pnpm local:test
      - name: Stack logs on failure
        if: failure()
        run: docker compose --profile stack logs --tail 80
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: stack-test-results, path: apps/web-storefront/test-results }
